[project]
name = "keylocker"
dynamic = ["version"]
description = "Library with the CLI to save the encrypted secrets in the configuration file, but a transparent read and write the new settings in the app."
readme = "README.md"
license = { text = "MIT" } 
authors = [
    { name = "vpuhoff", email = "vpuhoff@live.ru" }
]
requires-python = ">=3.10" # Явно указываем поддержку Python
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta", # Примерный статус
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [] 

# Стандартная секция для определения скриптов/точек входа

[project.scripts]
keylocker = "keylocker:main"

[tool.poetry]
# Build-time placeholder, not a release version. The Git tag is authoritative.
version = "0.0.0"

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"
strict = true

[tool.coverage.run]
source = ["keylocker", "scripts"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"
