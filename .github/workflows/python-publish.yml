# .github/workflows/python-publish.yml

name: Build, Test, and Publish Python Package (Pipenv)

permissions:
  contents: read

# Триггеры запуска:
on:
  push:
    branches: [ master, main, develop ]
    tags:
      - 'v*.*.*'
  # Тесты и сборка запускаются на ЛЮБОМ pull request (без фильтра по веткам),
  # чтобы каждый PR проверялся перед вливанием
  pull_request:

jobs:
  # Задача для сборки и тестирования
  build_and_test:
    name: Build & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    env:
      # Always create a fresh virtualenv; only dependency downloads are cached.
      PIPENV_VENV_IN_PROJECT: "true"

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # Dynamic versions need reachable Git tags and complete history.
        fetch-depth: 0

    - name: Set up Python
      id: setup_python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Pipenv
      run: python -m pip install --upgrade pip pipenv

    # Cache downloads, not installed packages: stale venvs can hide broken locks.
    - name: Cache dependency downloads
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-${{ runner.arch }}-pip-downloads-${{ steps.setup_python.outputs.python-version }}-${{ hashFiles('**/Pipfile.lock', 'pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-pip-downloads-${{ steps.setup_python.outputs.python-version }}-

    - name: Install dependencies using Pipenv
      run: pipenv sync --dev # Устанавливаем версии из Pipfile.lock без перегенерации

    - name: Run tests (pytest via Pipenv)
      run: >-
        pipenv run pytest --cov --cov-branch --cov-report=xml
        --junitxml=junit.xml -o junit_family=legacy tests/

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./junit.xml
        disable_search: true
        flags: python${{ matrix.python-version }}
        name: pytest-python-${{ matrix.python-version }}

    - name: Upload coverage reports to Codecov
      if: matrix.python-version == '3.10'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        disable_search: true

    # Сборка пакета (sdist и wheel) стандартным способом
    - name: Install build tools
      if: matrix.python-version == '3.10'
      run: pipenv run python -m pip install build

    - name: Build package
      if: matrix.python-version == '3.10'
      run: pipenv run python -m build # Стандартная команда сборки

    - name: Verify distribution versions
      if: matrix.python-version == '3.10'
      env:
        RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      run: pipenv run python scripts/verify_distribution.py dist/

    # Загрузка артефактов сборки
    - name: Upload build artifacts
      if: matrix.python-version == '3.10'
      uses: actions/upload-artifact@v7
      with:
        name: dist-python-3.10
        path: dist/

  # Задача для публикации на PyPI (запускается ТОЛЬКО на push тегов)
  deploy:
    name: Deploy to PyPI
    needs: build_and_test # Зависит от успешной сборки/тестов
    runs-on: ubuntu-26.04
    # OIDC доступен только publish-job, не сборке и не тестам.
    permissions:
      contents: read
      id-token: write
    # Условие запуска: только если событие - это push тега
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    environment:
      name: pypi
      url: https://pypi.org/p/keylocker

    steps:
    # Скачивание артефактов сборки из предыдущей задачи
    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: dist-python-3.10 # Имя должно совпадать с upload-artifact
        path: dist/

    # До первого релиза настройте Trusted Publisher на PyPI:
    # см. docs/trusted-publishing.md. Fallback на API-токен намеренно отсутствует.
    - name: Publish package to PyPI with attestations
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        packages-dir: dist/
        attestations: true
