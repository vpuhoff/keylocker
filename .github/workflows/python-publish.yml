# .github/workflows/python-publish.yml

name: Build, Test, and Publish Python Package (Pipenv)

permissions:
  contents: read

# Триггеры запуска:
on:
  push:
    branches: [ master, main, develop ]
    tags:
      - 'v*.*.*'
  # Тесты и сборка запускаются на ЛЮБОМ pull request (без фильтра по веткам),
  # чтобы каждый PR проверялся перед вливанием
  pull_request:

jobs:
  # Задача для сборки и тестирования
  build_and_test:
    name: Build & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      id: setup_python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Pipenv
      run: python -m pip install --upgrade pip pipenv

    # Кэширование Pipenv окружения для ускорения
    # В ключ включена версия Python: venv из кэша, созданный другой версией,
    # содержит битые absolute symlinks на интерпретатор
    - name: Cache Pipenv virtualenv
      uses: actions/cache@v6
      with:
        path: ~/.local/share/virtualenvs # Стандартный путь Pipenv для virtualenv
        key: ${{ runner.os }}-pipenv-${{ steps.setup_python.outputs.python-version }}-${{ hashFiles('**/Pipfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-pipenv-${{ steps.setup_python.outputs.python-version }}-

    - name: Install dependencies using Pipenv
      run: pipenv sync --dev # Устанавливаем версии из Pipfile.lock без перегенерации

    - name: Run tests (pytest via Pipenv)
      run: pipenv run pytest tests/ # Запускаем тесты через pipenv run

    # Сборка пакета (sdist и wheel) стандартным способом
    - name: Install build tools
      if: matrix.python-version == '3.10'
      run: pipenv run python -m pip install build

    - name: Build package
      if: matrix.python-version == '3.10'
      run: pipenv run python -m build # Стандартная команда сборки

    # Загрузка артефактов сборки
    - name: Upload build artifacts
      if: matrix.python-version == '3.10'
      uses: actions/upload-artifact@v7
      with:
        name: dist-python-3.10
        path: dist/

  # Задача для публикации на PyPI (запускается ТОЛЬКО на push тегов)
  deploy:
    name: Deploy to PyPI
    needs: build_and_test # Зависит от успешной сборки/тестов
    runs-on: ubuntu-26.04
    # OIDC доступен только publish-job, не сборке и не тестам.
    permissions:
      contents: read
      id-token: write
    # Условие запуска: только если событие - это push тега
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    environment:
      name: pypi
      url: https://pypi.org/p/keylocker

    steps:
    # Скачивание артефактов сборки из предыдущей задачи
    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: dist-python-3.10 # Имя должно совпадать с upload-artifact
        path: dist/

    # До первого релиза настройте Trusted Publisher на PyPI:
    # см. docs/trusted-publishing.md. Fallback на API-токен намеренно отсутствует.
    - name: Publish package to PyPI with attestations
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        packages-dir: dist/
        attestations: true
